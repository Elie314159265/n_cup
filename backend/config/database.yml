default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: backend_development
  username: root
  password:
  host: 127.0.0.1

test:
  <<: *default
  database: backend_test
  username: root
  password:
  host: 127.0.0.1

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
