# Example secrets file - DO NOT commit actual secrets to git
# Create actual secrets using kubectl commands below:
#
# kubectl create secret generic db-credentials \
#   --from-literal=url='mysql2://admin:<password>@<rds-endpoint>:3306/link_persona_production'
#
# kubectl create secret generic cognito-credentials \
#   --from-literal=user_pool_id='ap-northeast-1_xxxxxxxxx' \
#   --from-literal=client_id='xxxxxxxxxxxxxxxxxxxxxxxxxx'
#
# kubectl create secret generic grafana-credentials \
#   --from-literal=password='<your-password>'
#
# Values can be obtained via: terraform output

apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  url: "mysql2://admin:<password>@<rds-endpoint>.ap-northeast-1.rds.amazonaws.com:3306/link_persona_production"

---
apiVersion: v1
kind: Secret
metadata:
  name: cognito-credentials
type: Opaque
stringData:
  user_pool_id: "ap-northeast-1_xxxxxxxxx"
  client_id: "xxxxxxxxxxxxxxxxxxxxxxxxxx"

---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
type: Opaque
stringData:
  password: "<your-password>"
