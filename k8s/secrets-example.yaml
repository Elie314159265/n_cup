# Example secrets file - DO NOT commit actual secrets to git
# Create actual secrets using kubectl:
# kubectl create secret generic db-credentials --from-literal=url='mysql2://user:password@host:3306/dbname'
# kubectl create secret generic cognito-credentials --from-literal=user_pool_id='xxx' --from-literal=client_id='xxx'
# kubectl create secret generic grafana-credentials --from-literal=password='admin'

apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  url: "mysql2://admin:password@yoku-db.xxxxx.us-east-1.rds.amazonaws.com:3306/yoku_production"

---
apiVersion: v1
kind: Secret
metadata:
  name: cognito-credentials
type: Opaque
stringData:
  user_pool_id: "us-east-1_xxxxxxxxx"
  client_id: "xxxxxxxxxxxxxxxxxxxxxxxxxx"

---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
type: Opaque
stringData:
  password: "admin"  # Change this!
