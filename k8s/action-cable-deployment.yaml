apiVersion: apps/v1
kind: Deployment
metadata:
  name: action-cable
  labels:
    app: action-cable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: action-cable
  template:
    metadata:
      labels:
        app: action-cable
    spec:
      containers:
      - name: cable
        image: <AWS_ACCOUNT_ID>.dkr.ecr.ap-northeast-1.amazonaws.com/link_persona-api:latest
        command: ["bundle", "exec", "puma", "-p", "28080"]
        ports:
        - containerPort: 28080
          name: websocket
        env:
        - name: RAILS_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: url
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: redis_url
        resources:
          requests:
            memory: "256Mi"
            cpu: "125m"
          limits:
            memory: "512Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: action-cable-service
spec:
  selector:
    app: action-cable
  ports:
  - protocol: TCP
    port: 28080
    targetPort: 28080
  type: ClusterIP
